<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ច្បាប់ចរាចរណ៍ផ្លូវគោក - សួរចម្លើយ</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>ច្បាប់ចរាចរណ៍ផ្លូវគោក</h1>
    <p class="sub">សួរសំណួរអំពីច្បាប់ចរាចរណ៍ជាភាសាខ្មែរ</p>

    <form id="form">
      <textarea id="question" rows="3" required
        placeholder="ឧ. តើត្រូវពាក់មួកសុវត្ថិភាពពេលជិះម៉ូតូដែរឬទេ?"></textarea>
      <button id="submit" type="submit">សួរ</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <section id="answer" hidden></section>
    <section id="sources" hidden>
      <h2>ប្រភព / ឯកសារយោង</h2>
      <div id="source-list"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
